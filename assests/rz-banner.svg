
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05020b"/>
      <stop offset="50%" stop-color="#200044"/>
      <stop offset="100%" stop-color="#07020d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d9a3ff"/>
      <stop offset="100%" stop-color="#8b00ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".16"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>

  <circle cx="600" cy="180" r="190" fill="#8700ff" opacity=".12"/>
  <circle cx="600" cy="180" r="135" fill="none" stroke="#bd5cff" stroke-opacity=".3"/>
  <circle cx="600" cy="180" r="155" fill="none" stroke="#bd5cff" stroke-opacity=".2" stroke-dasharray="5 12"/>

  <path d="M25 90V25H150 M1050 25H1175V90 M25 350V415H150 M1050 415H1175V350"
        fill="none" stroke="#c77dff" stroke-width="3"/>

  <g font-family="monospace" font-size="14" fill="#d8a5ff" letter-spacing="3">
    <text x="52" y="65">RZ // DEVELOPER PROFILE</text>
    <text x="1148" y="65" text-anchor="end">SYSTEM ONLINE</text>
    <text x="52" y="385">MINECRAFT × DISCORD</text>
    <text x="1148" y="385" text-anchor="end">BUILD // CREATE // INNOVATE</text>
  </g>

  <g filter="url(#glow)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="600" y="205" font-size="166" letter-spacing="-8" fill="url(#neon)">RZ</text>
    <text x="600" y="260" font-size="42" letter-spacing="9" fill="#ffffff">DEVELOPMENT</text>
  </g>

  <path d="M280 286H920" stroke="#b84dff" stroke-width="2"/>
  <path d="M380 294H820" stroke="#8b00ff" stroke-width="1" opacity=".6"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="205" y="320" width="210" height="38" rx="8" fill="#281044" stroke="#9d4edd"/>
    <text x="310" y="345" fill="#ead5ff">MINECRAFT</text>

    <rect x="495" y="320" width="210" height="38" rx="8" fill="#281044" stroke="#9d4edd"/>
    <text x="600" y="345" fill="#ead5ff">DISCORD BOTS</text>

    <rect x="785" y="320" width="210" height="38" rx="8" fill="#281044" stroke="#9d4edd"/>
    <text x="890" y="345" fill="#ead5ff">WEB & SOFTWARE</text>
  </g>
</svg>
